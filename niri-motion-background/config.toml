# Shader/video presentation ceiling; not a monitor refresh-rate change.
fps = 24
battery_fps = 12
# Buffer dimensions relative to native pixels (0.5 means 1/4 pixel workload).
render_scale = 0.4
battery_render_scale = 0.32
pause_on_idle = true
idle_seconds = 120
pause_when_hidden = true
hidden_timeout_ms = 750
pause_on_fullscreen = true
pause_on_battery = false
hwdec = "auto-safe"
# If true, stop a video when mpv reports software decoding.
require_hardware_video = false
active = "eclipse-corona"

# Rotate through enabled entries in the matching day/night pool.
[rotation]
enabled = true
interval_seconds = 600
defer_while_paused = true

[day_night]
enabled = true
source = "noctalia" # "noctalia" resolved light/dark mode, or "schedule"
day_start = "07:00" # schedule and fallback if Noctalia is unavailable
day_brightness = 1.0
night_brightness = 0.65
night_start = "20:00"

