[package]
name = "motion-lock"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Wayland session locker with shared motion-render shaders and motion-login UI"

[dependencies]
motion-render = { path = "vendor/motion-render" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
glow = "0.18"
log = "0.4"
libc = "0.2"
rusttype = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = "0.4"
zeroize = "1"
pam-client = "0.5"
whoami = "1.6"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
