[package]
name = "motion-render"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared GPU shader/video and Wayland runtime"

[dependencies]
anyhow = "1"
glow = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
libloading = "0.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false }
toml = "1.1"
wayland-client = { version = "0.31", features = ["system"] }
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
